rem","gutter-mobile":"1rem","space-xl":"2rem","space-md":"1rem","space-2xs":"0.25rem","space-sm":"0.75rem","margin-tablet":"2rem","gutter-desktop":"1.5rem","space-xs":"0.5rem","space-2xl":"3rem"},fontFamily:{"label-caption":["Inter"],"body-sm":["Inter"],"headline-lg":["Plus Jakarta Sans"],"label-badge":["JetBrains Mono"],"body-md":["Inter"],"label-telemetry":["JetBrains Mono"],"display-hero-mobile":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"],"headline-xl-mobile":["Plus Jakarta Sans"],"body-lg":["Inter"],"headline-md":["Plus Jakarta Sans"],"display-hero":["Plus Jakarta Sans"]},fontSize:{"label-caption":["11px",{"lineHeight":"14px","letterSpacing":"0.02em","fontWeight":"500"}],"body-sm":["12px",{"lineHeight":"18px","letterSpacing":"0em","fontWeight":"400"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"600"}],"label-badge":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"22px","letterSpacing":"-0.005em","fontWeight":"400"}],"label-telemetry":["13px",{"lineHeight":"16px","letterSpacing":"-0.01em","fontWeight":"500"}],"display-hero-mobile":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-sm":["16px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-xl":["36px",{"lineHeight":"44px","letterSpacing":"-0.025em","fontWeight":"700"}],"headline-xl-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.02em","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"26px","letterSpacing":"-0.01em","fontWeight":"400"}],"headline-md":["20px",{"lineHeight":"28px","letterSpacing":"-0.015em","fontWeight":"600"}],"display-hero":["48px",{"lineHeight":"56px","letterSpacing":"-0.03em","fontWeight":"700"}]}}}};</script></head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-tablet"><main class="w-full max-w-lg"><div class="flex flex-col w-full items-center justify-center">
<div class="relative w-full max-w-md bg-surface-container-low rounded-xl p-space-lg md:p-space-xl shadow-2xl flex flex-col items-center">
<div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container-high mb-space-md group">
<div class="absolute inset-0 rounded-xl bg-primary-container/10 blur-sm pointer-events-none"></div>
<span class="material-symbols-outlined text-primary text-headline-md relative z-10 transition-transform duration-300 group-hover:scale-110">login</span>
</div>
<div class="text-center w-full mb-space-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight" id="form-heading">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-2xs" id="form-subheading">Sign in to access your local alert dashboard</p>
</div>
<div class="w-full flex p-1 bg-surface-container-lowest rounded-lg mb-space-lg">
<button class="flex-1 py-space-xs font-label-badge text-label-badge rounded-md bg-surface-container-high text-primary shadow-sm transition-all duration-200" id="tab-signin" onclick="switchAuthMode('signin')" type="button">
        Sign In
      </button>
<button class="flex-1 py-space-xs font-label-badge text-label-badge rounded-md text-on-surface-variant hover:text-on-surface transition-all duration-200" id="tab-register" onclick="switchAuthMode('register')" type="button">
        Register New Household
      </button>
</div>
<form class="w-full flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault(); simulateSubmit();">
<div class="flex flex-col gap-space-2xs">
<label class="font-label-caption text-label-caption text-on-surface-variant flex items-center justify-between" for="username">
<span>Username or Account ID</span>
<span class="font-label-telemetry text-[10px] text-primary/70 uppercase">SL-CEB UID</span>
</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-md text-body-md px-space-md py-space-sm pl-11 rounded-lg focus:outline-none focus:bg-surface-container transition-all" id="username" name="username" placeholder="Enter your username" required="" type="text" value="colombo3"/>
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/60 pointer-events-none text-headline-sm">badge</span>
</div>
</div>
<div class="hidden flex flex-col gap-space-md" id="register-fields">
<div class="flex flex-col gap-space-2xs">
<label class="font-label-caption text-label-caption text-on-surface-variant" for="residential-area">Residential Area &amp; Grid Sector</label>
<div class="relative flex items-center">
<select class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md px-space-md py-space-sm pl-11 rounded-lg focus:outline-none focus:bg-surface-container transition-all appearance-none cursor-pointer" id="residential-area" name="area">
<option class="bg-surface-container text-on-surface" value="colombo-03">Colombo 03 — Kollupitiya (Sector B4)</option>
<option class="bg-surface-container text-on-surface" value="colombo-07">Colombo 07 — Cinnamon Gardens (Sector A1)</option>
<option class="bg-surface-container text-on-surface" value="kandy-central">Kandy — Central Grid (Zone 2)</option>
<option class="bg-surface-container text-on-surface" value="galle-fort">Galle — Coastal Zone A</option>
<option class="bg-surface-container text-on-surface" value="dehiwala-mount">Dehiwala-Mount Lavinia (Zone C)</option>
</select>
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/60 pointer-events-none text-headline-sm">location_on</span>
<span class="material-symbols-outlined absolute right-3 text-on-surface-variant/60 pointer-events-none text-headline-sm">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-space-2xs">
<label class="font-label-caption text-label-caption text-on-surface-variant" for="street-address">Street Address &amp; Premise No.</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-md text-body-md px-space-md py-space-sm pl-11 rounded-lg focus:outline-none focus:bg-surface-container transition-all" id="street-address" name="street" placeholder="e.g., 42/1 Galle Road" type="text"/>
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/60 pointer-events-none text-headline-sm">home_pin</span>
</div>
</div>
</div>
<div class="flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<label class="font-label-caption text-label-caption text-on-surface-variant" for="password">Password</label>
<a class="font-label-caption text-label-caption text-primary hover:underline" href="#" id="forgot-link">Forgot?</a>
</div>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-md text-body-md px-space-md py-space-sm pl-11 pr-11 rounded-lg focus:outline-none focus:bg-surface-container transition-all tracking-widest" id="password" name="password" placeholder="••••••••" required="" type="password" value="user123"/>
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/60 pointer-events-none text-headline-sm">lock</span>
<button class="material-symbols-outlined absolute right-3 text-on-surface-variant/60 hover:text-on-surface transition-colors text-headline-sm" id="pwd-toggle-icon" onclick="togglePasswordVisibility()" type="button">
            visibility
          </button>
</div>
</div>
<button class="w-full mt-space-xs py-space-sm px-space-md bg-primary text-on-primary font-headline-sm text-headline-sm font-semibold rounded-lg hover:bg-primary-fixed-dim focus:outline-none shadow-md transition-all active:scale-[0.99] flex items-center justify-center gap-space-xs" id="submit-btn" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-headline-sm">arrow_forward</span>
</button>
</form>
<div class="mt-space-lg text-center">
<span class="font-body-sm text-body-sm text-on-surface-variant" id="footer-prompt">Don't have an account?</span>
<button class="font-body-sm text-body-sm text-primary font-medium hover:underline ml-1" id="footer-switch" onclick="toggleAuthMode()" type="button">
        Register here
      </button>
</div>
<div class="w-full mt-space-xl pt-space-md bg-surface-container-lowest/60 rounded-lg p-space-sm flex flex-col gap-1 items-center justify-center">
<div class="flex items-center gap-space-2xs text-on-surface-variant/80">
<span class="material-symbols-outlined text-[13px] text-tertiary">lock_open</span>
<span class="font-label-badge text-[10px] uppercase tracking-wider text-on-surface-variant">Evaluator Quick Credentials</span>
</div>
<div class="flex flex-wrap items-center justify-center gap-x-space-md gap-y-1 font-label-telemetry text-label-caption text-on-surface-variant/70 text-center">
<button class="hover:text-primary transition-colors cursor-pointer" onclick="fillCredentials('admin', 'admin123')" type="button">
<span class="text-primary font-semibold">Admin:</span> admin / admin123
        </button>
<span class="text-on-surface-variant/30">•</span>
<button class="hover:text-primary transition-colors cursor-pointer" onclick="fillCredentials('colombo3', 'user123')" type="button">
<span class="text-secondary font-semibold">Citizen:</span> colombo3 / user123
        </button>
</div>
</div>
<div class="mt-space-md flex items-center gap-2" id="live-indicator">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary"></span>
</span>
<span class="font-label-telemetry text-[11px] text-tertiary">Grid Live Telemetry Active (CEB / NWSDB)</span>
</div>
</div>
</div>
<script>
  let currentAuthMode = 'signin';

  function switchAuthMode(mode) {
    currentAuthMode = mode;
    const isRegister = mode === 'register';
    const registerFields = document.getElementById('register-fields');
    const tabSignIn = document.getElementById('tab-signin');
    const tabRegister = document.getElementById('tab-register');
    const heading = document.getElementById('form-heading');
    const subheading = document.getElementById('form-subheading');
    const submitBtn = document.getElementById('submit-btn');
    const footerPrompt = document.getElementById('footer-prompt');
    const footerSwitch = document.getElementById('footer-switch');
    const forgotLink = document.getElementById('forgot-link');

    if (isRegister) {
      registerFields.classList.remove('hidden');
      tabRegister.className = 'flex-1 py-space-xs font-label-badge text-label-badge rounded-md bg-surface-container-high text-primary shadow-sm transition-all duration-200';
      tabSignIn.className = 'flex-1 py-space-xs font-label-badge text-label-badge rounded-md text-on-surface-variant hover:text-on-surface transition-all duration-200';
      heading.textContent = 'Register Household';
      subheading.textContent = 'Enroll your premises for targeted civic telemetry alerts';
      submitBtn.innerHTML = '<span>Complete Household Registration</span><span class="material-symbols-outlined text-headline-sm">check_circle</span>';
      footerPrompt.textContent = 'Already registered?';
      footerSwitch.textContent = 'Sign in here';
      forgotLink.classList.add('hidden');
    } else {
      registerFields.classList.add('hidden');
      tabSignIn.className = 'flex-1 py-space-xs font-label-badge text-label-badge rounded-md bg-surface-container-high text-primary shadow-sm transition-all duration-200';
      tabRegister.className = 'flex-1 py-space-xs font-label-badge text-label-badge rounded-md text-on-surface-variant hover:text-on-surface transition-all duration-200';
      heading.textContent = 'Welcome Back';
      subheading.textContent = 'Sign in to access your local alert dashboard';
      submitBtn.innerHTML = '<span>Sign In</span><span class="material-symbols-outlined text-headline-sm">arrow_forward</span>';
      footerPrompt.textContent = "Don't have an account?";
      footerSwitch.textContent = 'Register here';
      forgotLink.classList.remove('hidden');
    }
  }

  function toggleAuthMode() {
    switchAuthMode(currentAuthMode === 'signin' ? 'register' : 'signin');
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('pwd-toggle-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function fillCredentials(u, p) {
    switchAuthMode('signin');
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
  }

  function simulateSubmit() {
    const btn = document.getElementById('submit-btn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-headline-sm">progress_activity</span><span>Authenticating...</span>';
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }, 1200);
  }
</script></main></body></html>
