services:
  # Local MongoDB is intentionally disabled. The application uses the cloud
  # MongoDB connection supplied through MONGO_URI in .env.
  # mongo:
  #   image: mongo:6.0
  #   container_name: power-water-mongo
  #   restart: always
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   environment:
  #     MONGO_INITDB_DATABASE: ${MONGO_DB:-power_water_alerts}
  #   healthcheck:
  #     test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - app-network

  # Backend Express API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: power-water-server
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      # Cloud MongoDB URI supplied through the root .env file.
      MONGO_URI: ${MONGO_URI:?MONGO_URI must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  # Frontend React (Nginx) Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: power-water-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network

# volumes:
#   mongo-data:
#     driver: local

networks:
  app-network:
    driver: bridge
